# CI for the public mirror. The release workflow re-proves typecheck + tests
# before publishing, so this lane exists for a different reason: a public repo
# that customers read should visibly build, and a broken sync should be obvious
# here rather than at the moment someone clicks Run on a release.
#
# Source of this file: bridge/node/mirror/.github/workflows/ci.yml in the
# monorepo. Edit it there and re-sync.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor declared in package.json engines, current LTS, and the
        # major the release workflow publishes from.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
